networks:
  app-network:
    driver: bridge
services:
  postgres:
    image: postgres:17-alpine3.23
    container_name: postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dom_u_morya"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn dom_u_morya.wsgi:application --bind 0.0.0.0:8000  && 
             python manage.py migrate"
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/var/www/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

volumes:
  postgres-data:
  static_volume: